<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>행안부 보도자료 알리미</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <h1>행안부 보도자료 알리미</h1>

      <div class="controls">
        <label>부처명 선택 (복수 선택 가능)</label>
        <div class="ministry-actions">
          <button id="selectAllBtn" type="button">전체 선택</button>
          <button id="clearAllBtn" type="button">전체 해제</button>
        </div>
        <div id="ministryList" class="ministry-list"></div>
        <button id="refreshBtn" type="button">새로고침</button>
      </div>

      <p id="status" class="status">불러오는 중...</p>

      <section>
        <ul id="newsList" class="news-list"></ul>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
